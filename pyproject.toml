[project]
name = "tesla"
version = "0.1.0"
description = "Tesla Fleet API CLI: Powerwall-aware vehicle charging"
readme = "README.md"
authors = [
    { name = "Sheldon McGrandle", email = "developer@8cylinder.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.10",
    "click>=8.1",
    "cryptography>=42",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tesla-fleet-api>=1.15",
]

[project.scripts]
tesla = "tesla.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
