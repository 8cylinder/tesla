[project]
name = "tesla"
version = "0.1.0"
description = "Tesla Fleet API CLI: Powerwall-aware vehicle charging"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Sheldon McGrandle", email = "developer@8cylinder.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "click>=8.1",
    "cryptography>=42",
    "platformdirs>=4",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tesla-fleet-api>=1.21.0",
]

[project.scripts]
tesla = "tesla.cli:main"

[project.urls]
Homepage = "https://github.com/8cylinder/tesla"
Repository = "https://github.com/8cylinder/tesla"
Issues = "https://github.com/8cylinder/tesla/issues"

[dependency-groups]
dev = [
    "furo",
    "myst-parser",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=6.0",
    "ruff>=0.17.3",
    "sphinx>=9.0",
    "sphinx-autobuild",
    "sphinx-click>=6.0",
    "ty",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
extend-select = ["ANN", "PGH003", "PYI"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=tesla",
    "--cov-branch",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["tesla"]

[tool.coverage.report]
# TODO: raise to 90 once the CLI and auto-charge paths are covered.
fail_under = 70
show_missing = true
